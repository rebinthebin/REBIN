name: rebin
description: "REBIN - Geri Dönüşüm Mobil Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^17.2.1
  flutter_riverpod: ^2.5.1
  percent_indicator: ^4.2.5
  google_fonts: ^8.0.2
  provider: ^6.1.5+1
  lottie: ^3.3.3
  flutter_svg: ^2.2.4
  vector_math: ^2.2.0
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  image: ^4.8.0
  location: ^8.0.1
  fl_chart: ^1.2.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  http: ^1.2.0
  riverpod_annotation: ^2.3.5
  mobile_scanner: ^7.2.0
  path: ^1.9.1
  pytorch_lite: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  custom_lint: ^0.6.4
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.10
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/map_style.json
    - assets/app_logo.png
    - assets/models/
    
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_logo.png"
